name: Préparer une version Windows
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:installer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orbit-windows
          path: dist/Orbit-Setup-*.exe
          if-no-files-found: error

  draft:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orbit-windows
          path: installer
      - name: Créer le brouillon avec son installateur
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(installer/Orbit-Setup-*.exe)
          [[ ${#files[@]} == 1 && -f "${files[0]}" ]]
          [[ $(basename "${files[0]}") =~ ^Orbit-Setup-([0-9]+\.[0-9]+\.[0-9]+)\.exe$ ]]
          version="${BASH_REMATCH[1]}"
          gh release create "v$version" "${files[0]}" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --draft --title "Orbit $version" \
            --notes "Installateur pour Windows 64 bits. Téléchargez Orbit-Setup-$version.exe dans les fichiers de cette version."
